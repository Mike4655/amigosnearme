name: Resend Usage Monitor

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 23:00 UTC (19:00 ET) — 하루 마무리 점검
  workflow_dispatch:         # 수동 실행 가능

jobs:
  check-resend-usage:
    runs-on: ubuntu-latest
    steps:
      - name: Check email_log and alert if near Resend limit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.error, json, os
          from datetime import datetime, timezone, timedelta

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SERVICE_KEY  = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          now_utc   = datetime.now(timezone.utc)
          today_str = now_utc.strftime('%Y-%m-%d')
          month_str = now_utc.strftime('%Y-%m')

          today_start = today_str + 'T00:00:00Z'
          month_start = now_utc.strftime('%Y-%m-01') + 'T00:00:00Z'

          def query_count(gte_date: str) -> int:
              url = (
                f"{SUPABASE_URL}/rest/v1/email_log"
                f"?select=id"
                f"&sent_at=gte.{gte_date}"
                f"&is_voided=eq.false"
              )
              req = urllib.request.Request(
                url,
                headers={
                  'apikey': SERVICE_KEY,
                  'Authorization': f'Bearer {SERVICE_KEY}',
                  'Prefer': 'count=exact',
                  'Range': '0-0',
                }
              )
              try:
                with urllib.request.urlopen(req) as res:
                  content_range = res.headers.get('Content-Range', '0/0')
                  # format: "0-0/총개수" or "*/총개수"
                  total = int(content_range.split('/')[-1])
                  return total
              except Exception as e:
                print(f'Count query error: {e}')
                return 0

          daily_count = query_count(today_start)
          month_count = query_count(month_start)

          print(f'Resend usage — Today ({today_str}): {daily_count}/100  |  Month ({month_str}): {month_count}/3000')

          # 임계값: 일간 80통 이상 OR 월간 2,400통 이상
          DAILY_WARN  = 80
          MONTHLY_WARN = 2400

          if daily_count < DAILY_WARN and month_count < MONTHLY_WARN:
              print('✅ Usage within safe limits. No alert needed.')
              exit(0)

          # 임계값 초과 → 어드민 알림 발송
          level = '🔴 CRITICAL' if daily_count >= 95 or month_count >= 2800 else '🟡 WARNING'
          print(f'{level} — Sending alert to admin')

          payload = json.dumps({
            'scenario': 'RESEND_ALERT',
            'to': '',          # RESEND_ALERT는 isAdminScenario → ADMIN_EMAIL로 자동 발송
            'data': {
              'daily_count': str(daily_count),
              'month_count': str(month_count),
              'today_date':  today_str,
              'month_label': month_str,
            },
            'ref_id': None,
          }).encode()

          fn_req = urllib.request.Request(
            f"{SUPABASE_URL}/functions/v1/send-email",
            data=payload,
            headers={
              'Authorization': f'Bearer {SERVICE_KEY}',
              'Content-Type': 'application/json'
            },
            method='POST'
          )

          try:
            with urllib.request.urlopen(fn_req) as fn_res:
              body = fn_res.read().decode()
              print(f'Alert sent: {fn_res.status} {body}')
          except urllib.error.HTTPError as e:
            print(f'Alert failed: {e.code} {e.read().decode()}')
            raise SystemExit(1)

          EOF
